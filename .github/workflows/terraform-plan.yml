name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_REGION: us-east-1

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Package Lambda function
        run: |
          cd lambda/bedrock-asset-processor
          zip -r ../bedrock-asset-processor.zip index.py
          cd ../..
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      
      - name: Terraform Plan
        working-directory: terraform
        id: plan
        run: |
          terraform plan -no-color -var="db_password=${{ secrets.DB_PASSWORD }}" | tee plan.txt
          echo "PLAN_SUMMARY<<EOF" >> $GITHUB_ENV
          grep -E "Plan:|Add:|Change:|Destroy:|No changes" plan.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Post Plan to PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = process.env.PLAN_SUMMARY || 'Plan generated successfully';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            
            const output = `#### Terraform Plan 📖
            
            \`\`\`
            ${summary}
            \`\`\`
            
            **Full plan:** [View in Actions](${runUrl})
            
            *Pusher: @${{ github.actor }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });