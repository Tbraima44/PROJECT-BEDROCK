name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm infrastructure teardown'
        required: true
        default: ''
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Package Lambda function
        run: |
          cd lambda/bedrock-asset-processor
          zip -r ../bedrock-asset-processor.zip index.py
          cd ../..
      
      - name: Run destroy script
        run: |
          chmod +x scripts/destroy-all.sh
          ./scripts/destroy-all.sh ${{ secrets.DB_PASSWORD }}
      
      - name: Notify destruction complete
        run: |
          echo "## 🔥 Terraform Destroy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**All AWS resources have been destroyed.**" >> $GITHUB_STEP_SUMMARY

  skip-confirmation:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy != 'DESTROY' }}
    steps:
      - name: Destruction aborted
        run: |
          echo "## ⚠️ Terraform Destroy - ABORTED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You must type **DESTROY** (exactly, all caps) in the confirmation field to proceed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No resources were modified." >> $GITHUB_STEP_SUMMARY