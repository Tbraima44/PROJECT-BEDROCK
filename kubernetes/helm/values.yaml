# =============================================================================
# Retail Store Sample App - Helm Values
# =============================================================================

# Disable all in-cluster databases
mysql:
  enabled: false
dynamodb:
  enabled: false

# Number of replicas for all services
replicaCount: 1

# ---------------------------------------------------------------------------
# Cart Service - MySQL RDS
# ---------------------------------------------------------------------------
carts:
  datasource:
    url: "jdbc:mysql://MYSQL_HOST_PLACEHOLDER:3306/retaildb?useSSL=false&allowPublicKeyRetrieval=true"
    username: "MYSQL_USER_PLACEHOLDER"
    password: "MYSQL_PASS_PLACEHOLDER"

# ---------------------------------------------------------------------------
# Catalog Service - MySQL RDS
# ---------------------------------------------------------------------------
catalog:
  datasource:
    url: "jdbc:mysql://MYSQL_HOST_PLACEHOLDER:3306/retaildb?useSSL=false&allowPublicKeyRetrieval=true"
    username: "MYSQL_USER_PLACEHOLDER"
    password: "MYSQL_PASS_PLACEHOLDER"

# ---------------------------------------------------------------------------
# Orders Service - MySQL RDS
# ---------------------------------------------------------------------------
orders:
  datasource:
    url: "jdbc:mysql://MYSQL_HOST_PLACEHOLDER:3306/retaildb?useSSL=false&allowPublicKeyRetrieval=true"
    username: "MYSQL_USER_PLACEHOLDER"
    password: "MYSQL_PASS_PLACEHOLDER"

# ---------------------------------------------------------------------------
# Checkout Service - DynamoDB
# ---------------------------------------------------------------------------
checkout:
  dynamodb:
    tableName: "project-bedrock-retail-store"
    region: "us-east-1"