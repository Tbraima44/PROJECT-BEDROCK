apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          value: "dbadmin"
        - name: DB_PASSWORD
          value: "YourSecurePassword123!"
        - name: DB_NAME
          value: "retaildb"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-app
spec:
  selector:
    app: catalog
  ports:
  - port: 80
    targetPort: 8080